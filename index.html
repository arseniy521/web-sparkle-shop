    <!-- Google tag with Consent Mode v2: everything denied by default; gtag.js is loaded
         only after the visitor accepts cookies (cookie `nius_consent` on .nius.cz). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      gtag('set', 'ads_data_redaction', true);
      window.__niusLoadGtag = function () {
        if (window.__niusGtagLoaded) return;
        window.__niusGtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-VNMLWF0XZG';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-VNMLWF0XZG');
      };
      window.__niusGrantConsent = function () {
        gtag('consent', 'update', {
          ad_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'denied',
          analytics_storage: 'granted'
        });
        window.__niusLoadGtag();
      };
      (function () {
        var accepted = /(?:^|;\s*)nius_consent=accepted/.test(document.cookie);
        if (!accepted) {
          try { accepted = localStorage.getItem('nius-cookie-consent') === 'accepted'; } catch (e) {}
        }
        if (accepted) window.__niusGrantConsent();
      })();
    </script>
