name: Check the site

# Runs on every change of the site's code, files, checks or configuration; documentation alone does not.
on:
  push:
    branches: [main, astro, 'astro/**']
    paths: ['src/**', 'public/**', 'scripts/**', 'tests/**', 'preview/**', 'package.json', 'package-lock.json', '*.config.ts', '*.config.js', 'tsconfig.json', 'lighthouserc.cjs', '.github/workflows/checks.yml']
  pull_request:
    branches: [astro, main]
    paths: ['src/**', 'public/**', 'scripts/**', 'tests/**', 'preview/**', 'package.json', 'package-lock.json', '*.config.ts', '*.config.js', 'tsconfig.json', 'lighthouserc.cjs', '.github/workflows/checks.yml']
  # The publish workflow runs these checks before it builds the release.
  workflow_call:
    secrets:
      VITE_AMPLITUDE_API_KEY:
        required: true
      VITE_MAPY_API_KEY:
        required: true
      VITE_GOOGLE_CLIENT_ID:
        required: true
      # Optional: empty values build the site without the Google Ads conversions (check:env warns).
      VITE_GOOGLE_ADS_ID:
        required: false
      VITE_GOOGLE_ADS_LEAD_LABEL:
        required: false
      VITE_GOOGLE_ADS_CONTACT_LABEL:
        required: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      VITE_AMPLITUDE_API_KEY: ${{ secrets.VITE_AMPLITUDE_API_KEY }}
      VITE_MAPY_API_KEY: ${{ secrets.VITE_MAPY_API_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_ADS_ID: ${{ secrets.VITE_GOOGLE_ADS_ID }}
      VITE_GOOGLE_ADS_LEAD_LABEL: ${{ secrets.VITE_GOOGLE_ADS_LEAD_LABEL }}
      VITE_GOOGLE_ADS_CONTACT_LABEL: ${{ secrets.VITE_GOOGLE_ADS_CONTACT_LABEL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check the build environment
        run: npm run check:env

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check translation keys
        run: npm run i18n:check

      - name: Build
        run: npm run build

      - name: Check SEO of the built pages
        run: npm run check:seo -- --scope built

      - name: Browser scenarios
        run: npm run check:e2e

      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, so the Chrome that
      # Lighthouse starts cannot create its sandbox and aborts ("No usable sandbox"). Playwright
      # starts its browser without the sandbox; Lighthouse keeps it. The runner is discarded after
      # the job.
      - name: Let Chrome create its sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Lighthouse
        run: npm run check:lhci

      - name: Upload the traces of failed browser scenarios
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore

      - name: Upload the check results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: checks
          path: .checks
          if-no-files-found: ignore
