name: Check the site

# The only gate: main accepts pull requests with this check green (repository ruleset).
# No path filter: a required check that does not run would block the pull request.
# No secrets: the tests and the e2e build use fake keys, and a pull request from a fork gets none.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check translation keys
        run: npm run i18n:check

      - name: Build
        run: npm run build

      - name: Check SEO of the built pages
        run: npm run check:seo -- --scope built

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        id: browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system libraries
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the system libraries of Chromium
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browser scenarios
        run: npm run check:e2e

      - name: Upload the traces of failed browser scenarios
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
