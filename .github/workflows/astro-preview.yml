name: Publish the Astro preview

on:
  push:
    branches: [astro]

permissions:
  contents: read

defaults:
  run:
    working-directory: astro

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VITE_AMPLITUDE_API_KEY: ${{ secrets.VITE_AMPLITUDE_API_KEY }}
      VITE_MAPY_API_KEY: ${{ secrets.VITE_MAPY_API_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      # A flag only: the token and account id are given to the deploy step alone.
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the reference copy of the old site
        run: npm run baseline

      - name: Compare screenshots with the reference
        id: visual
        continue-on-error: true
        run: npm run check:visual

      - name: Upload the visual report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-report
          path: astro/.checks/visual
          if-no-files-found: ignore

      - name: Assemble the preview
        run: npm run preview:assemble

      # wrangler looks for functions/ in its working directory, so it runs from .preview.
      - name: Deploy the preview to Cloudflare Pages
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: astro/.preview
        run: |
          npx wrangler pages deploy dist --project-name nius-site-preview --branch astro
          echo "Preview: https://astro.nius-site-preview.pages.dev" >> "$GITHUB_STEP_SUMMARY"
