name: Publish the preview

on:
  push:
    branches: [astro]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VITE_AMPLITUDE_API_KEY: ${{ secrets.VITE_AMPLITUDE_API_KEY }}
      VITE_MAPY_API_KEY: ${{ secrets.VITE_MAPY_API_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      # A flag only: the token and account id are given to the deploy step alone.
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assemble the preview
        run: npm run preview:assemble

      # Outside a terminal wrangler cannot ask to create a missing project, so the first run
      # creates it. The branch "astro" is then a preview deployment of the project.
      - name: Create the Cloudflare Pages project on the first run
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .preview
        run: |
          if npx wrangler pages project list | grep -q 'nius-site-preview'; then
            echo "Project nius-site-preview exists."
          else
            npx wrangler pages project create nius-site-preview --production-branch main
          fi

      # wrangler looks for functions/ in its working directory, so it runs from .preview.
      - name: Deploy the preview to Cloudflare Pages
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .preview
        run: |
          npx wrangler pages deploy dist --project-name nius-site-preview --branch astro
          echo "Preview: https://astro.nius-site-preview.pages.dev" >> "$GITHUB_STEP_SUMMARY"
