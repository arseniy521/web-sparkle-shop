name: Publish NIUS

# Started by hand, from main only. Builds main with the release keys and deploys that build to
# GitHub Pages. The checks ran in the pull request: main accepts nothing else (repository ruleset).
# Rollback: re-run the last good run of this workflow (it rebuilds its own commit).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_AMPLITUDE_API_KEY: ${{ secrets.VITE_AMPLITUDE_API_KEY }}
      VITE_MAPY_API_KEY: ${{ secrets.VITE_MAPY_API_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      # Optional: an empty value builds the site without that Google Ads part; check:env warns.
      VITE_GOOGLE_ADS_ID: ${{ secrets.VITE_GOOGLE_ADS_ID }}
      VITE_GOOGLE_ADS_LEAD_LABEL: ${{ secrets.VITE_GOOGLE_ADS_LEAD_LABEL }}
      VITE_GOOGLE_ADS_CONTACT_LABEL: ${{ secrets.VITE_GOOGLE_ADS_CONTACT_LABEL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the release keys
        run: npm run check:env

      - name: Build the site
        run: npm run build

      # Every manifest page must be built, with the production API address in the code.
      - name: Check SEO of the build
        run: npm run check:seo -- --production --dist dist

      - name: Upload the build for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
